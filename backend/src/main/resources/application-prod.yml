spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQLUSER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Optimized Hikari Connection Pool Settings (Task 5)
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect

  allowed-origins: ${ALLOWED_ORIGINS:https://crm.evagroups.in}

app:
  admin-recovery-key: ${ADMIN_RECOVERY_KEY:EVA-ADMIN-SAFE-2024}
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000 # 24 hours
    vapid:
      public-key: ${VAPID_PUBLIC_KEY}
      private-key: ${VAPID_PRIVATE_KEY}
  allowed-origins: ${ALLOWED_ORIGINS:https://crm.evagroups.in}
  backup-email: ${COMPANY_BACKUP_EMAIL}
  backup-cron: ${APP_BACKUP_CRON:0 0 0 * * ?}
  resend-api-key: ${RESEND_API_KEY:}
  sender-email: ${SENDER_EMAIL:onboarding@resend.dev}

# Enable Gzip Response Compression
server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024
